# Настройки бота. Меняйте прямо здесь — код трогать не нужно.

# Часовой пояс канала (Бишкек = +6). Нужен, чтобы считать посты «за сегодня».
utc_offset_hours: 6

# Расписание постов (время Бишкека). Днём 5 постов со звуком, ночью 2 — без звука (см. quiet_hours).
# Если GitHub пропустил запуск, бот догоняет слот с паузой catchup_gap_minutes,
# но только слоты за последние catchup_window_hours часа.
day_slots: ["09:17", "12:17", "15:17", "18:17", "21:17"]
night_slots: ["00:17", "06:17"]
catchup_gap_minutes: 40
catchup_window_hours: 3

# Сколько часов назад смотреть новости
lookback_hours: 36

# Не больше стольких постов в день
daily_limit: 7

# Порядок рубрик в течение дня: каждый пост берёт следующую рубрику плана.
# 7 постов: два ночных про мир, днём СНГ и мир через один.
# Если в слот СНГ свежего СНГ нет, выйдет мир, а СНГ попробуется в следующий раз.
plan: [WORLD, WORLD, CIS, WORLD, CIS, WORLD, CIS]

# Разнообразие: одна страна и один вид схемы — не больше стольких раз в день
max_per_country: 2
max_per_scheme: 2

# Посты этих рубрик всегда уходят без звука. Сейчас днём все посты со звуком, ночью — без (quiet_hours)
silent_categories: []

# Тихие часы: в это время все посты уходят без звука (расписание GitHub может опаздывать)
quiet_hours:
  from: 23
  to: 8

# Если свежих историй нет ни в одной рубрике — сколько раз в день можно опубликовать напоминание о типичной схеме
evergreen_max_per_day: 1

# Рубрики по географии: название, хэштег и что считается рубрикой (это читает ИИ при отборе).
# Порядок важен: если рубрика по плану пустая, бот пробует следующие по этому списку.
categories:
  CIS:
    name: "СНГ"
    hashtag: "#СНГ"
    describe: "в странах СНГ: Кыргызстан, Казахстан, Узбекистан, Таджикистан, Туркменистан, Россия, Беларусь, Армения, Азербайджан, Молдова. Приоритет — Кыргызстан, затем Узбекистан и Казахстан"
  WORLD:
    name: "мир"
    hashtag: "#мир"
    describe: "в любой стране мира, кроме стран СНГ: США, Европа, Азия, Ближний Восток, Латинская Америка, Африка, Австралия"

# Рубрики по видам схем: ИИ относит каждую историю к одному виду, под постом появляется его хэштег.
# В закреплённом посте эти хэштеги работают как оглавление.
schemes:
  bank_call:
    hashtag: "#звонок_из_банка"
    describe: "звонки и сообщения от имени банков, полиции, операторов связи, госорганов"
  phishing:
    hashtag: "#фишинг"
    describe: "фишинговые ссылки, SMS о посылках, штрафах и долгах, поддельные сайты и QR-коды"
  prepayment:
    hashtag: "#предоплата"
    describe: "фейковые продавцы и магазины, аренда, доски объявлений, «покупатели» со ссылкой на оплату"
  investment:
    hashtag: "#инвестиции"
    describe: "лжеброкеры, криптовалюта, финансовые пирамиды, «пассивный доход»"
  hacking:
    hashtag: "#взлом"
    describe: "угон аккаунтов Telegram, WhatsApp и соцсетей, коды из SMS, «проголосуй за меня»"
  relative:
    hashtag: "#родственник"
    describe: "«родственник или друг в беде», поддельные голоса и видео (дипфейки)"
  job:
    hashtag: "#работа"
    describe: "дропперы, «лёгкий заработок», фейковые вакансии и задания за деньги"
  romance:
    hashtag: "#знакомства"
    describe: "романтические аферы и мошенничество на сайтах знакомств"
  other:
    hashtag: "#другие_схемы"
    describe: "всё, что не подходит под остальные виды"

# Хэштег в конце каждого поста
hashtags: "#разбор"

# Типичные схемы для напоминаний (по кругу)
evergreen:
  - "фальшивое уведомление о посылке со ссылкой на «доставку»"
  - "предоплата за товар продавцу из Instagram или Telegram"
  - "аренда квартиры с задатком через доску объявлений"
  - "звонок от «службы безопасности банка»"
  - "просьба «проголосуй за меня» и взлом Telegram или WhatsApp"
  - "«покупатель», который присылает ссылку, чтобы «получить оплату»"
  - "«подработка» с переводами через свою карту (дропперство)"
  - "лжеброкеры и «инвестиции» с гарантированным доходом"
  - "«родственник попал в беду» и просит срочно перевести деньги"
  - "фейковые розыгрыши и «вы выиграли приз»"

# Новость попадает в отбор, только если в заголовке или описании есть хоть одно из этих слов (части слов)
keywords:
  # русский и языки Центральной Азии
  - мошен
  - афер
  - обман
  - фишинг
  - вишинг
  - кибер
  - дроппер
  - дропер
  - лжеброкер
  - предоплат
  - фейков
  - поддельн
  - похитил
  - взлом
  - алдамчы      # кыргызский
  - алаяқ        # казахский
  - firibgar     # узбекский (латиница)
  - фирибгар     # узбекский (кириллица)
  # английский
  - scam
  - fraud
  - phishing
  - swindl
  - impersonat
  - con artist
  - money mule
  # немецкий, французский, испанский, португальский, итальянский, турецкий
  - betrug
  - betrüger
  - abzocke
  - arnaque
  - escroquer
  - escroc
  - estafa
  - golpe
  - golpista
  - truffa
  - truffator
  - dolandırıc

# Слова для предварительного определения СНГ (окончательно решает ИИ)
regions:
  CIS: [кыргыз, киргиз, бишкек, " ош ", "в оше", чуй, иссык, нарын, талас, джалал, баткен, "мвд кр",
        узбек, ташкент, самарканд, бухар, наманган, андижан, фергана, казах, алматы, астана, шымкент, караганд,
        таджик, душанбе, туркмен, росси, москв, петербург, беларус, минск, армен, ереван, азербайдж, баку, молдов, кишин,
        kyrgyz, bishkek, uzbek, tashkent, kazakh, almaty, astana, tajik, russia, moscow, belarus, armenia, azerbaijan, moldova]

# Внутри СНГ эти страны поднимаются выше в отборе
priority:
  KG: [кыргыз, киргиз, бишкек, " ош ", "в оше", чуй, иссык, нарын, талас, джалал, баткен, "мвд кр", kyrgyz, bishkek]
  UZ: [узбек, ташкент, самарканд, бухар, наманган, андижан, фергана, uzbek, tashkent]
  KZ: [казах, алматы, астана, шымкент, караганд, kazakh, almaty, astana]

# Домены СМИ и госорганов, которые не нужно «обезвреживать» в тексте
safe_domains: [24.kg, kaktus.media, akipress.org, sputnik.kg, economist.kg, vb.kg, kun.uz, gazeta.uz, spot.uz, daryo.uz,
               tengrinews.kz, informburo.kz, nur.kz, zakon.kz, kursiv.media, post.kz, kazpost.kz, egov.kz, gov.kg, gov.uz,
               antifraud.kz, ftc.gov, fbi.gov, ic3.gov, bleepingcomputer.com, krebsonsecurity.com]

# Параметры Google Новостей по умолчанию (язык и издание). when: — за какой срок искать.
google_params: "hl=ru&gl=RU&ceid=RU:ru"
google_when: "2d"

# Источники. type: google — поиск Google Новостей, bing — поиск Bing News, rss — лента сайта.
# category — подсказка, к какой рубрике обычно относятся новости (CIS / WORLD); без неё решает ИИ.
# Новости на любом языке: ИИ всё равно пишет пост по-русски.
# Если источник в логах пишет ошибку — просто удалите его строки, бот работает и без него.
sources:
  # ── СНГ ──
  - name: "Google: Кыргызстан"
    type: google
    query: "мошенники Кыргызстан OR Бишкек OR Ош"
    category: CIS
  - name: "Google: Кыргызстан, кибер"
    type: google
    query: "кибермошенничество OR фишинг Кыргызстан"
