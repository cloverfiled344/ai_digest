# Готовый пост: выходит первым, до новостей. Поля как у обычного разбора.
location: "Telegram, по всему СНГ"
flag: "📱"
country_tag: "Telegram"
scheme: hacking
title: "«Это ты на видео?» — сообщение, после которого крадут аккаунт и деньги"
intro: "Одна из самых массовых схем в Telegram. Сообщение часто приходит от знакомого — его аккаунт уже взломан, и рассылка идёт по всем его контактам."
how_it_works: "Вам пишут «Это ты на видео?», «Тут тебя сняли» или «Это ты на фото?» и прикладывают файл или ссылку. Файл только выглядит как видео: на самом деле это приложение (часто .apk), которое после установки на Android читает SMS-коды и даёт мошенникам доступ к банку. Ссылка ведёт на страницу, где для «просмотра» просят войти в Telegram — номер и код из сообщения. После этого мошенники забирают аккаунт и рассылают то же сообщение уже вашим друзьям."
red_flags:
  - "Настоящее видео в Telegram открывается прямо в чате, во встроенном плеере, — его не нужно скачивать или устанавливать"
  - "Файл с расширением .apk или просьба «разрешить установку из неизвестных источников»"
  - "Чтобы посмотреть ролик, просят ввести номер телефона и код из Telegram"
  - "Сообщение без приветствия и контекста, давит на любопытство и стыд: «срочно посмотри, тебя все обсуждают»"
what_to_do:
  - "Ничего не открывайте и не вводите. Спросите знакомого по звонку или в другом мессенджере, писал ли он"
  - "Включите облачный пароль: Настройки → Конфиденциальность → Облачный пароль. Без него украсть аккаунт по одному коду не получится"
  - "Проверьте Настройки → Устройства и завершите все незнакомые сеансы"
  - "Если уже установили файл — включите режим полёта, позвоните в банк по номеру на карте, удалите приложение и заявите в милицию (102)"
