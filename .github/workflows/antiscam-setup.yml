name: Antiscam — проверка подключения

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        type: choice
        default: send_test_message
        options: [send_test_message, find_chat_id]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: antiscam/requirements.txt

      - run: pip install -r antiscam/requirements.txt

      - name: Выполнить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ANTISCAM_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ANTISCAM_CHAT_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "find_chat_id" ]; then
            python antiscam/bot.py --find-chat
          else
            python antiscam/bot.py --test-message
          fi
