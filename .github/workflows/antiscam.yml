name: Antiscam posts

on:
  schedule:
    # Время в UTC, Бишкек = UTC+6. Расписание GitHub ненадёжно: часовые запуски он часто пропускает
    # (из 17 в день срабатывало 2–3). Поэтому каждый запуск работает до 5,5 часа в режиме --loop:
    # пост каждый час, а если план отстал — догоняет. Хватит, чтобы сработали 2 запуска из 6.
    # Запуски: 8:05, 11:05, 14:05, 17:05, 20:05 и запасной 22:05 по Бишкеку. После 23:00 бот не публикует.
    - cron: "5 2,5,8,11,14 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch:             # кнопка «Run workflow» для ручного запуска
    inputs:
      category:
        description: "Рубрика (auto — по плану дня)"
        type: choice
        default: auto
        options: [auto, CIS, WORLD]
      dry_run:
        description: "Тест: только показать пост в логе, не отправлять"
        type: boolean
        default: true
      loop:
        description: "Работать по плану несколько часов, как плановый запуск (догнать пропущенные посты)"
        type: boolean
        default: false

permissions:
  contents: write                # чтобы сохранять память бота (data/antiscam_state.json)

concurrency:
  # плановые запуски идут по очереди (один работает, следующий ждёт), ручные — отдельно, чтобы не ждать часами
  group: antiscam-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STATE_PATH: data/antiscam_state.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: antiscam/requirements.txt

      - run: pip install -r antiscam/requirements.txt

      - name: Собрать новости и опубликовать
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}            # общий ключ с дайджестом
          TELEGRAM_BOT_TOKEN: ${{ secrets.ANTISCAM_TELEGRAM_TOKEN }}     # отдельный бот для канала
          TELEGRAM_CHAT_ID: ${{ secrets.ANTISCAM_CHAT_ID }}              # @адрес канала или -100...
          ANTHROPIC_MODEL: ${{ vars.ANTISCAM_MODEL || 'claude-haiku-5-5' }}
          BOT_CTA: ${{ vars.ANTISCAM_CTA }}
          ADD_KYRGYZ: ${{ vars.ANTISCAM_ADD_KYRGYZ }}
          CATEGORY: ${{ inputs.category || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GIT_PERSIST: "1"               # сохранять память в репозиторий после каждого поста
          LOOP_MINUTES: "330"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.loop }}" = "true" ]; then
            python antiscam/bot.py --loop
          else
            python antiscam/bot.py
          fi

      - name: Сохранить память бота
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "antiscam: update memory"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
