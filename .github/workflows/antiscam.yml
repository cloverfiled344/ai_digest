name: Antiscam posts

on:
  schedule:
    # Время в UTC, Бишкек = UTC+6. Расписание GitHub ненадёжно и часто пропускает запуски,
    # поэтому каждый запуск работает до 5,5 часа в режиме --loop и публикует посты в слоты из
    # antiscam/config.yaml (днём 9:17, 12:17, 15:17, 18:17, 21:17; ночью 0:17 и 6:17 без звука).
    # Запуски каждые 3 часа — хватит, чтобы сработала половина.
    - cron: "5 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:             # кнопка «Run workflow» для ручного запуска
    inputs:
      category:
        description: "Рубрика (auto — по плану дня; QUIZ — викторина недели сейчас; DIGEST — дайджест недели сейчас)"
        type: choice
        default: auto
        options: [auto, CIS, WORLD, QUIZ, DIGEST]
      format:
        description: "Формат поста (auto — по времени: после 18:00 «Схема дня», иначе «Молния»)"
        type: choice
        default: auto
        options: [auto, featured, flash]
      dry_run:
        description: "Тест: только показать пост в логе, не отправлять"
        type: boolean
        default: true
      loop:
        description: "Работать по плану несколько часов, как плановый запуск (догнать пропущенные посты)"
        type: boolean
        default: false

permissions:
  contents: write                # чтобы сохранять память бота (data/antiscam_state.json)

concurrency:
  # плановые запуски идут по очереди (один работает, следующий ждёт), ручные — отдельно, чтобы не ждать часами
  # все запуски, которые публикуют по плану (плановые и ручные с loop), идут строго по очереди —
  # иначе два запуска одновременно публикуют пост в один слот. Отдельно — только тестовые (dry_run).
  group: antiscam-${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'test' || 'publish' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STATE_PATH: data/antiscam_state.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: antiscam/requirements.txt

      - run: pip install -r antiscam/requirements.txt

      # для картинки «Схемы дня» (шаблон antiscam/video/src/Shot.tsx, Remotion)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: antiscam/video/package-lock.json

      - name: Remotion для картинок
        working-directory: antiscam/video
        run: |
          sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null 2>&1 || true
          npm ci --no-audit --no-fund --silent
          npx remotion browser ensure > /dev/null

      - name: Собрать новости и опубликовать
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}            # общий ключ с дайджестом
          TELEGRAM_BOT_TOKEN: ${{ secrets.ANTISCAM_TELEGRAM_TOKEN }}     # отдельный бот для канала
          TELEGRAM_CHAT_ID: ${{ secrets.ANTISCAM_CHAT_ID }}              # @адрес канала или -100...
          ANTHROPIC_MODEL: ${{ vars.ANTISCAM_MODEL || 'claude-sonnet-5-5' }}
          BOT_CTA: ${{ vars.ANTISCAM_CTA }}
          ADD_KYRGYZ: ${{ vars.ANTISCAM_ADD_KYRGYZ }}
          CATEGORY: ${{ ((inputs.category == 'QUIZ' || inputs.category == 'DIGEST') && 'auto') || inputs.category || 'auto' }}
          GITHUB_TOKEN: ${{ github.token }}   # загрузка картинок в ветку media
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}   # читалка статей r.jina.ai (бесплатный ключ — без лимита 401)
          FORMAT: ${{ inputs.format != 'auto' && inputs.format || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GIT_PERSIST: "1"               # сохранять память в репозиторий после каждого поста
          LOOP_MINUTES: "330"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.category }}" = "QUIZ" ]; then
            FORCE=1 python antiscam/bot.py --quiz
          elif [ "${{ inputs.category }}" = "DIGEST" ]; then
            FORCE=1 python antiscam/bot.py --digest
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.loop }}" = "true" ]; then
            python antiscam/bot.py --loop
          else
            python antiscam/bot.py
          fi

      - name: Сохранить память бота
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_PATH"
          [ -f data/antiscam_videos.json ] && git add data/antiscam_videos.json
          git diff --cached --quiet && exit 0
          git commit -m "antiscam: update memory"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
