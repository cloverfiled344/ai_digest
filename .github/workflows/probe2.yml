name: probe2
on: {push: {branches: [probe2]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C="https://arctic-shift.photon-reddit.com/api/comments"
          for u in "tree?link_id=t3_1y3kev2&limit=50" "search?link_id=1y3kev2&subreddit=smallbusiness&limit=100&fields=body,score,parent_id,author" "search?link_id=1y3kev2&limit=50&fields=body,score,parent_id,author" "search?link_id=t3_1y3sla0&limit=100&fields=body,parent_id"; do
            /usr/bin/time -f "%es" curl -s -m 40 -o o -w "%{http_code} " "$C/$u"; echo "$u :: $(head -c 250 o)"; python3 -c "import json;d=json.load(open('o')).get('data') or [];print('n=',len(d))"; sleep 2; done
